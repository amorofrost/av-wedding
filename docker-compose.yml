# Удобный запуск на VM. Значения берутся из файла .env рядом.
services:
  wedding:
    build: .
    image: av-wedding:latest
    container_name: av-wedding
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    # Весь .env целиком попадает в контейнер: иначе новые переменные (CONTACT_PHONE,
    # SESSION_COOKIE_SECURE и т.д.) пришлось бы дописывать в двух местах, а забытая
    # переменная проявляется молча — телефон просто не показывается, вход в админку
    # просто не срабатывает.
    env_file:
      - .env
    environment:
      # Внутри контейнера порт всегда 3000 — наружу он пробрасывается через ports.
      # Это должно идти после env_file, чтобы PORT из .env не ломал проброс.
      - PORT=3000
    volumes:
      # Сохраняет локальное файловое хранилище между перезапусками,
      # если Azure Table Storage не используется.
      - wedding-data:/app/data

volumes:
  wedding-data:
