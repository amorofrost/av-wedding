# Удобный запуск на VM. Значения берутся из файла .env рядом.
services:
  wedding:
    build: .
    image: av-wedding:latest
    container_name: av-wedding
    restart: unless-stopped
    ports:
      # Только на localhost: снаружи сайт открывается через nginx в соседнем
      # контейнере (он и завершает TLS), а этот порт остаётся для отладки
      # с самой машины. Публичный адрес — в APP_URL из .env.
      - "127.0.0.1:${PORT:-3000}:3000"
    # Весь .env целиком попадает в контейнер: иначе новые переменные (CONTACT_PHONE,
    # SESSION_COOKIE_SECURE и т.д.) пришлось бы дописывать в двух местах, а забытая
    # переменная проявляется молча — телефон просто не показывается, вход в админку
    # просто не срабатывает.
    env_file:
      - .env
    environment:
      # Внутри контейнера порт всегда 3000 — наружу он пробрасывается через ports.
      # Это должно идти после env_file, чтобы PORT из .env не ломал проброс.
      - PORT=3000
    volumes:
      # Сохраняет локальное файловое хранилище между перезапусками,
      # если Azure Table Storage не используется.
      - wedding-data:/app/data
    networks:
      # default — своя сеть проекта; edge — общая сеть с nginx соседнего
      # проекта, через неё приходит весь публичный трафик (см. ниже).
      - default
      - edge

volumes:
  wedding-data:

networks:
  # Сеть создаётся вручную (`docker network create edge`) и не принадлежит ни
  # одному compose-проекту: `docker compose down` в соседнем проекте не должен
  # её удалять. В ней nginx находит нас по имени av-wedding и проксирует на
  # порт 3000.
  edge:
    external: true
